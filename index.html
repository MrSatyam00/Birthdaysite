<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  text-align: center;
  color: white;
  background: linear-gradient(270deg, #ff6ec4, #7873f5, #42e695);
  background-size: 600% 600%;
  animation: bgMove 10s infinite alternate;
}

@keyframes bgMove {
  0% { background-position: 0% }
  100% { background-position: 100% }
}

/* ⭐ Stars */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  animation: twinkle 2s infinite;
}

@keyframes twinkle {
  0%,100% {opacity: 0.2;}
  50% {opacity: 1;}
}

/* 🌳 Tree */
.tree {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
}

.trunk {
  width: 20px;
  height: 0;
  background: brown;
  margin: auto;
  animation: grow 2s forwards;
}

@keyframes grow {
  to { height: 120px; }
}

.leaves {
  width: 0;
  height: 0;
  border-left: 60px solid transparent;
  border-right: 60px solid transparent;
  border-bottom: 100px solid green;
  margin: auto;
  opacity: 0;
  animation: showLeaves 2s 2s forwards, sway 2s infinite alternate;
}

@keyframes showLeaves {
  to { opacity: 1; }
}

@keyframes sway {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}

/* 🎉 Text */
h1 {
  margin-top: 80px;
  font-size: 40px;
}

p {
  font-size: 18px;
}

/* 📚 Buttons */
.btn {
  display: inline-block;
  margin: 10px;
  padding: 10px 20px;
  background: white;
  color: black;
  border-radius: 20px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

<h1>✨ Happy Birthday Akanksha Ji ✨</h1>

<p>Stay खुश, stay amazing 💖<br>
You deserve happiness always 🌸</p>

<!-- 📚 DOWNLOADS -->
<div>
  <a href="book1.pdf" download class="btn">Book 1</a>
  <a href="book2.pdf" download class="btn">Book 2</a>
  <a href="book3.pdf" download class="btn">Book 3</a>
</div>

<!-- 🌳 TREE -->
<div class="tree">
  <div class="trunk"></div>
  <div class="leaves"></div>
</div>

<script>
// ⭐ Stars generate
for (let i = 0; i < 100; i++) {
  let star = document.createElement("div");
  star.className = "star";
  star.style.top = Math.random() * window.innerHeight + "px";
  star.style.left = Math.random() * window.innerWidth + "px";
  star.style.animationDuration = (Math.random() * 2 + 1) + "s";
  document.body.appendChild(star);
}
</script>

</body>
</html>
