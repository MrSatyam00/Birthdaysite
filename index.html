<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Akanksha 🎉</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

/* Burst dots */
.dot {
  position: absolute;
  width: 6px;
  height: 6px;
  background: lime;
  border-radius: 50%;
  animation: explode 1s forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}

/* Tree */
.tree {
  position: absolute;
  bottom: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 120px;
  background: green;
  border-radius: 20px;
  opacity: 0;
  animation: grow 2s forwards 1s;
}

@keyframes grow {
  to {
    bottom: 0;
    opacity: 1;
  }
}

/* Text */
.text {
  opacity: 0;
  margin-top: 100px;
  animation: fadeIn 2s forwards 3s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

h1 {
  font-size: 45px;
  color: pink;
}

p {
  font-size: 18px;
  width: 70%;
  margin: auto;
  color: #ddd;
}

.btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: pink;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>
<audio auto play loop>  
  <source src="music.mp3" type="audio/mpeg">
</audio>
  
<div id="burst"></div>

<div class="tree"></div>

<div class="text">
  <h1>🎉 Happy Birthday Akanksha Ji 🎉</h1>
  <p>
    Wishing you endless happiness, smiles, and success ✨  
    You deserve all the good things in life 💖  
    Stay खुश, stay amazing 🌸
  </p>

  <a href="book.pdf" download>
    <button class="btn">Your Gift 🎁</button>
  </a>
</div>

<script>
const burst = document.getElementById("burst");

for(let i=0; i<80; i++){
  let d = document.createElement("div");
  d.className = "dot";

  let x = (Math.random()*400 - 200) + "px";
  let y = (Math.random()*400 - 200) + "px";

  d.style.setProperty('--x', x);
  d.style.setProperty('--y', y);

  d.style.left = "50%";
  d.style.top = "50%";

  burst.appendChild(d);
}
</script>

</body>
</html>
