<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      text-align: center;
      font-family: Arial;
      overflow: hidden;
    }

    h1 {
      margin-top: 80px;
      font-size: 40px;
      color: pink;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px pink; }
      to { text-shadow: 0 0 30px red; }
    }

    .container {
      margin-top: 50px;
    }

    .book {
      background: rgba(255,255,255,0.1);
      margin: 20px auto;
      padding: 20px;
      width: 250px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background: red;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    /* background animation dots */
    .circle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: pink;
      border-radius: 50%;
      animation: move 10s linear infinite;
    }

    @keyframes move {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }
  </style>
</head>

<body>

<h1>🎂 Happy Birthday 🎉</h1>

<div class="container">

  <div class="book">
    <h3>Book 1</h3>
    <a href="book1.pdf" download>Download</a>
  </div>

  <div class="book">
    <h3>Book 2</h3>
    <a href="book2.pdf" download>Download</a>
  </div>

  <div class="book">
    <h3>Book 3</h3>
    <a href="book3.pdf" download>Download</a>
  </div>

</div>

<!-- animated dots -->
<script>
  for(let i=0;i<20;i++){
    let c=document.createElement("div");
    c.className="circle";
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(c);
  }
</script>

</body>
</html>
